name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for asset in "" styles.css caprini.mjs app.mjs; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
              "${SITE_URL}${asset}" -o "/tmp/${asset:-index.html}"
          done
          grep -F "Caprini VTE Risk Calculator" /tmp/index.html >/dev/null
          grep -F ".app-shell" /tmp/styles.css >/dev/null
          grep -F "calculateScore" /tmp/caprini.mjs >/dev/null
          grep -F "renderFactors" /tmp/app.mjs >/dev/null
